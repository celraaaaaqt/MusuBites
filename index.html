<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/jpeg"
      href="/src/assets/heros/musugo-official-logo.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>MusuGo</title>
  </head>
  <style>
    html,
    body {
      width: 100%;
      padding: 0;
      margin: 0;
    }

    .hero-bg {
      background-image:
        linear-gradient(
          to bottom,
          rgba(15, 14, 12, 0.15) 0%,
          rgba(253, 252, 248, 1) 92%
        ),
        radial-gradient(
          circle at 30% 20%,
          #e8ddc8 0%,
          #cbb896 45%,
          #8a7452 100%
        ),
        url("src/assets/heros/GO-cover-photo.jpg");
    }
  </style>
  <body class="font-poppins bg-neutral-50">
    <nav
      class="sticky top-0 z-50 flex items-center justify-between w-[100%] mx-auto px-4 sm:px-6 py-2 bg-linear-to-br from-primary-500 to-primary-200 backdrop-blur-sm border border-white/20 shadow-xl shadow-black/20"
    >
      <img
        class="w-30 h-16 sm:w-30 sm:h-15 object-contain"
        src="src/assets/heros/revised_logo-removebg-preview.png"
        alt="MusuGo Logo"
      />

      <div class="hidden md:flex items-center gap-8">
        <a href="#" class="text-blue-950 font-semibold hover:text-blue-800">
          Home
        </a>

        <a href="#" class="text-blue-950 font-semibold hover:text-blue-800">
          Menu
        </a>

        <a href="#" class="text-blue-950 font-semibold hover:text-blue-800">
          About
        </a>

        <a href="#" class="text-blue-950 font-semibold hover:text-blue-800">
          Socmeds
        </a>

        <button
          class="bg-blue-500 rounded-xl px-5 py-2 text-white hover:bg-blue-800 transition"
        >
          Contact Us
        </button>
      </div>
      <button
        id="menuBtn"
        class="md:hidden relative w-8 h-8 flex flex-col justify-center items-center gap-1.5 z-50"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="mobileMenu"
      >
        <span
          id="bar1"
          class="block w-7 h-0.5 bg-blue-950 rounded-full transition-all duration-300 ease-in-out"
        ></span>
        <span
          id="bar2"
          class="block w-7 h-0.5 bg-blue-950 rounded-full transition-all duration-300 ease-in-out"
        ></span>
        <span
          id="bar3"
          class="block w-7 h-0.5 bg-blue-950 rounded-full transition-all duration-300 ease-in-out"
        ></span>
      </button>
    </nav>

    <div
      id="mobileMenu"
      style="transform: translateX(100%)"
      class="fixed top-0 right-0 h-full w-3/4 max-w-xs bg-[linear-gradient(135deg,rgba(89,195,255,0.25),rgba(192,221,187,0.25))] backdrop-blur-3xl px-6 py-8 z-40 shadow-2xl transform translate-x-full transition-transform duration-500 ease-in-out"
    >
      <div class="flex flex-col items-center gap-6 mt-35">
        <a href="#" class="text-white font-semibold text-lg hover:text-blue-300"
          >Home</a
        >
        <a href="#" class="text-white font-semibold text-lg hover:text-blue-300"
          >Menu</a
        >
        <a href="#" class="text-white font-semibold text-lg hover:text-blue-300"
          >About</a
        >
        <a href="#" class="text-white font-semibold text-lg hover:text-blue-300"
          >Socmeds</a
        >
        <button
          class="bg-blue-500 rounded-xl px-6 py-3 text-white font-medium hover:bg-blue-800 transition w-full"
        >
          Contact Us
        </button>
      </div>
    </div>

    <section class="relative w-full overflow-hidden">
      <!-- Background photo area — swap this div's background-image for your real product photo -->
      <div
        class="hero-bg relative w-full pt-28 pb-20 px-6 sm:px-10 md:px-16 lg:px-24"
      >
        <div class="max-w-6xl mx-auto">
          <!-- Badge -->
          <span
            class="inline-block bg-primary-100 text-primary-700 text-sm font-medium px-4 py-1.5 rounded-full mb-6"
          >
            Street-Side Fresh
          </span>

          <!-- Headline -->
          <h1
            class="font-heading font-extrabold text-secondary-800 leading-[0.95] tracking-tight text-5xl sm:text-6xl md:text-7xl lg:text-8xl max-w-3xl"
          >
            Tasty.<br />
            Affordable.<br />
            Satisfying.
          </h1>

          <!-- Subtext -->
          <p
            class="mt-6 text-neutral-600 text-base sm:text-lg max-w-md leading-relaxed"
          >
            The perfect snack, crafted with care and ready when you are.
          </p>

          <!-- CTA -->
          <button
            class="mt-8 inline-flex items-center gap-2 bg-primary-500 hover:bg-primary-600 text-white font-medium text-base px-7 py-3.5 rounded-full shadow-lg shadow-primary-500/20 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-2"
          >
            Order Now
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <section class="min-h-screen flex justify-center items-start pt-5">
      <div
        class="w-[90%] max-w-4xl bg-gradient-to-br from-primary-500 to-primary-200 backdrop-blur-xsm rounded-xl border border-primary-900 shadow-2xl p-7 md:p-14 text-white"
      >
        <br />
        <p class="text-4xl sm:text5xl font-semibold mb-3 text-center p-20">
          Ready to taste our
          <span class="text-blue-200">MusuGo</span>?
        </p>
        <a
          href="https://www.facebook.com/MusuGo"
          class="block w-fit mx-auto bg-primary-600 rounded-xl px-6 py-3 text-white font-medium hover:bg-primary-800 transition"
        >
          Order Now
        </a>
      </div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
